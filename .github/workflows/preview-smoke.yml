name: Deploy preview smoke test

# Waits for the Netlify deploy preview of this pull request, then checks the live API and
# pages against the real upstream data. Also records fresh upstream fixtures as an artifact.
on:
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW: https://deploy-preview-${{ github.event.number }}--isithotapp.netlify.app
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Record live upstream fixtures
        run: pnpm fixtures && node scripts/summarise-fixtures.mjs --print
        continue-on-error: true

      - name: Commit the recorded fixtures (when synthetic or recorded with older requests)
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          committed=$(git show HEAD:packages/providers/test/fixtures/SOURCE.md)
          recorded=$(cat packages/providers/test/fixtures/SOURCE.md)
          if ! grep -q Recorded <<<"$recorded"; then
            echo "Recording did not complete; nothing to commit."; exit 0
          fi
          # Re-record when either the forecast or the climate request line has changed.
          requests() { grep -E '^(Forecast|Climate) request:' <<<"$1" || true; }
          if ! grep -q synthetic <<<"$committed" &&
             [ "$(requests "$committed")" = "$(requests "$recorded")" ]; then
            echo "Committed fixtures already match the current requests; leaving them alone."; exit 0
          fi
          # Only commit recordings the provider tests accept. (A push from this workflow does not
          # start CI, so the next push to the branch is the first full run on them.)
          if ! pnpm vitest run packages/providers; then
            echo "Provider tests fail on the new recordings; not committing them."; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/providers/test/fixtures
          git commit -m "Record live upstream fixtures for provider tests"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      # A convenience copy (changed recordings are committed above): never fail the smoke test on it.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: live-fixtures
          path: packages/providers/test/fixtures/
          retention-days: 3

      - name: Wait for the deploy preview of this commit
        run: |
          for i in $(seq 1 90); do
            commit=$(curl -fsS "$PREVIEW/version.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit)}catch{console.log("")}})')
            if [ "$commit" = "$SHA" ]; then echo "Preview is live for $SHA"; exit 0; fi
            echo "Waiting ($i): preview has '${commit:-nothing}'"
            sleep 10
          done
          echo "Timed out waiting for the deploy preview"; exit 1

      - name: Smoke test the preview (all four sites)
        run: node scripts/smoke.mjs "$PREVIEW" --wet --snow --wind

      - name: Lighthouse (mobile) on the deploy preview, and production for comparison
        run: |
          # Netlify adds its review toolbar to deploy previews only: leave it out so the numbers
          # match what visitors to the live site get.
          for url in "$PREVIEW/" "$PREVIEW/in/london-gb" "$PREVIEW/wet" "$PREVIEW/snow" "$PREVIEW/wind" "https://isithot.today/"; do
            # Warm the CDN first: production visitors mostly get cached pages.
            origin=$(node -e 'console.log(new URL(process.argv[1]).origin)' "$url")
            curl -fsS -o /dev/null "$url"; curl -fsS -o /dev/null "$origin/api/v1/today"
            npx -y lighthouse@12 "$url" --quiet --form-factor=mobile \
              --only-categories=performance,accessibility,best-practices,seo \
              --blocked-url-patterns='*/.netlify/scripts/cdp*' \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh.json || true
            node scripts/lighthouse-summary.mjs lh.json "$url"
          done
        continue-on-error: true
