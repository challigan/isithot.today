name: Production smoke test

# Waits for the production deploy of each push to main, then checks the three live sites against
# the real upstream data: isithot.today (API and pages), isitwet.today and willitsnow.today (served
# by the edge function from the /wet and /snow pages), and the redirects between them: a path
# under another site's prefix goes to that site, and www.willitsnow.today to willitsnow.today.
on:
  push:
    branches: [main]

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: https://isithot.today
      WET_SITE: https://isitwet.today
      SNOW_SITE: https://willitsnow.today
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      # The smoke test uses Node's built-ins only, so there is nothing to install.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the production deploy of this commit
        run: |
          for i in $(seq 1 90); do
            commit=$(curl -fsS "$SITE/version.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit)}catch{console.log("")}})')
            if [ "$commit" = "$SHA" ]; then echo "Production is live for $SHA"; exit 0; fi
            echo "Waiting ($i): production has '${commit:-nothing}'"
            sleep 10
          done
          echo "Timed out waiting for the production deploy"; exit 1

      - name: Smoke test isithot.today, isitwet.today and willitsnow.today
        run: node scripts/smoke.mjs "$SITE" --wet-site "$WET_SITE" --snow-site "$SNOW_SITE"

      - name: Paths under another site's prefix, and www.willitsnow.today, redirect to that site
        run: |
          failed=0
          expect() {
            got=$(curl -sSI -o /dev/null -w '%{http_code} %{redirect_url}' "$1")
            if [ "$got" = "301 $2" ]; then echo "PASS  $1 -> $got"
            else echo "FAIL  $1 -> '$got' (expected 301 $2)"; failed=1; fi
          }
          expect "$SITE/wet" "$WET_SITE/"
          expect "$SITE/wet/in/newcastle-upon-tyne-gb" "$WET_SITE/in/newcastle-upon-tyne-gb"
          expect "$SITE/wet?lat=51.5&lon=-0.12" "$WET_SITE/?lat=51.5&lon=-0.12"
          expect "$SITE/snow" "$SNOW_SITE/"
          expect "$SITE/snow/in/newcastle-upon-tyne-gb" "$SNOW_SITE/in/newcastle-upon-tyne-gb"
          expect "$SITE/snow?lat=51.5&lon=-0.12" "$SNOW_SITE/?lat=51.5&lon=-0.12"
          expect "$WET_SITE/snow" "$SNOW_SITE/"
          expect "$WET_SITE/snow/in/newcastle-upon-tyne-gb" "$SNOW_SITE/in/newcastle-upon-tyne-gb"
          expect "$SNOW_SITE/wet" "$WET_SITE/"
          expect "$SNOW_SITE/wet/in/newcastle-upon-tyne-gb" "$WET_SITE/in/newcastle-upon-tyne-gb"
          expect "https://www.willitsnow.today/" "$SNOW_SITE/"
          expect "https://www.willitsnow.today/in/newcastle-upon-tyne-gb" "$SNOW_SITE/in/newcastle-upon-tyne-gb"
          exit $failed
