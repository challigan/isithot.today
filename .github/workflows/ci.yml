name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build:netlify
        env:
          DATA_SOURCE: synthetic
      - name: JavaScript budget (25 KB gzipped)
        run: node scripts/js-budget.mjs

  e2e:
    name: Playwright
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Only a failed run's report is worth keeping, and a full artifact store must not fail CI.
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
