# will it snow? for iPhone (iOS build spec, section 9.1 and Appendix A), for XcodeGen 2.46.0.
# ci/xcodegen.sh (or `xcodegen generate` on a Mac) writes WillItSnow.xcodeproj beside this file;
# the project is never committed. Plain sources, not synced folders. XcodeGen never writes the
# plists or entitlements: they are named through build settings, not its `info` or
# `entitlements` keys, which would regenerate them.
name: WillItSnow
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  developmentLanguage: en-GB
configFiles:
  Debug: Configs/Snow.xcconfig
  Release: Configs/Snow.xcconfig
packages:
  IsItCore:
    path: Packages/IsItCore
  IsItKit:
    path: Packages/IsItKit
targets:
  WillItSnow:
    type: application
    platform: iOS
    sources:
      - path: Apps/Snow/App
      # Also the generated Assets.xcassets (the app icon) and Fonts/ (BrandFont's four files).
      - path: Apps/Snow/Resources
        excludes: ['Info.plist', '*.entitlements']
      # The fixtures pnpm mobile:generate writes, for -fixture (DebugHooks.swift). Release builds
      # leave them out (EXCLUDED_SOURCE_FILE_NAMES below), so no archive carries them.
      - path: Packages/IsItCore/Tests/IsItTestSupport/Resources/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SNOW_APP_ID)
        INFOPLIST_FILE: Apps/Snow/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/Snow/Resources/WillItSnow.entitlements
        # The generated set in Assets.xcassets. Base.xcconfig leaves every other target without.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: Fixtures
    dependencies:
      # IsItState holds AppModel; IsItLogic the rules whose types it shows (the picked hour) and
      # the home screen's presenters.
      - package: IsItCore
        products: [IsItModel, IsItLogic, IsItState]
      # IsItLocation (Core Location) is the app's alone, as IsItAds is: never the widget's. So is
      # IsItPurchases: the purchase is the app's alone, as the ads are.
      - package: IsItKit
        products: [IsItServices, IsItLocation, IsItUI, IsItAds, IsItPurchases, SnowKit]
      - target: WillItSnowWidgets
  WillItSnowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Snow/Widgets
        excludes: ['Info.plist', '*.entitlements']
      # The fonts are resources of both targets: an extension can't load fonts from the app's
      # bundle (section 9.7).
      - path: Apps/Snow/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SNOW_WIDGET_ID)
        INFOPLIST_FILE: Apps/Snow/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/Snow/Widgets/Widgets.entitlements
    dependencies:
      - package: IsItCore
        products: [IsItModel]
      # Never IsItAds: the widget links no ads code (sections 9.1 and 18.3); nor IsItLocation,
      # so no location API is in its binary; nor IsItPurchases: a widget never sells (App Review
      # 4.4).
      - package: IsItKit
        products: [IsItServices, IsItWidgetUI, SnowKit]
  WillItSnowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/Snow/Tests
      - path: Packages/IsItCore/Tests/IsItTestSupport/Resources/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: today.willitsnow.app.tests
        GENERATE_INFOPLIST_FILE: YES
    # Hosted by the app, so the tests run with its entitlements (the App Group, V1).
    dependencies:
      - target: WillItSnow
      - package: IsItCore
        products: [IsItModel]
      - package: IsItKit
        products: [IsItServices, IsItUI, IsItWidgetUI, SnowKit]
  # The SKTestSession tests (spec 13 and 17.2), hosted by the app as StoreKit Test needs (a
  # hostless bundle gets xctest's own StoreKit environment), in a plan of their own on the iOS
  # 26.2 simulator (StoreKit.xctestplan; ci/test.sh StoreKit; ios.yml's storekit job).
  # Snow.storekit is a resource of this bundle only, loaded by its URL in this bundle
  # (SKTestSession(contentsOf:)), whichever bundle a named lookup would search, so the app's
  # bundle never holds it. StoreKitTest links by its import, from the testing search paths every
  # test bundle has.
  WillItSnowStoreKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/Snow/StoreKitTests
      - path: Apps/Snow/StoreKit/Snow.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: today.willitsnow.app.storekittests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WillItSnow
      - package: IsItCore
        products: [IsItModel, IsItLogic, IsItState]
      - package: IsItKit
        products: [IsItServices, IsItPurchases]
  WillItSnowUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      # FixtureLaunchTests, LaunchTests, phase 5.4's HomeTests, OfflineTests and HomeAuditTests
      # with HomeScreens.swift, phase 6's PickerTests and SettingsTests with ScreenAudit.swift,
      # every audit's contrast proof in DrawnText.swift, phase 8.3's AdsTests, the only ones
      # launched without -noads 1, and phase 7.1's UpgradeTests, over StoreKit's stand-in
      # (DebugHooks.swift); Generated/HomeScreens.json (pnpm mobile:generate, from
      # page.json) and Generated/Surfaces.json (from brandColours.ts) are resources of the bundle,
      # where the tests read what each screen shows and the colours it is drawn in.
      - path: Apps/Snow/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: today.willitsnow.app.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: WillItSnow
schemes:
  WillItSnow:
    build:
      targets:
        WillItSnow: all
        WillItSnowTests: [test]
        WillItSnowStoreKitTests: [test]
        WillItSnowUITests: [test]
    run:
      config: Debug
      # Off by default; tick one in Xcode's scheme editor to launch on a fixture.
      commandLineArguments:
        '-fixture aberdeen-snow': false
        '-fixture leeds-dry': false
      # Cmd-R in Xcode buys from Snow.storekit, with Xcode's transaction manager to approve,
      # refund and revoke; CI never runs the Run action, and XcodeGen writes no StoreKit setting
      # into the Test action.
      storeKitConfiguration: Apps/Snow/StoreKit/Snow.storekit
    test:
      config: Debug
      testPlans:
        - path: TestPlans/Unit.xctestplan
          defaultPlan: true
        - path: TestPlans/UI.xctestplan
        - path: TestPlans/StoreKit.xctestplan
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
